name: PerfSense Benchmark

env:
    # Immutable pin: this workflow always builds and runs this exact
    # revision of PerfSense-AI. Verify the SHA is still current before
    # changing it (tags do not exist on the repo yet).
    PERFSENSE_REF: 25a48f1dbde8b6c732a30340ff422ffc8566c1ad

# Runs on PRs that touch runtime code. Posts a single performance comparison
# comment. Comment-only — never fails checks or blocks merges.
# Runtime-file filtering happens in the "Check runtime files changed" step:
# event-level `paths` filters do not dispatch reliably on fork PRs.
#
# Baseline: PRs always compare against baseline.json fetched from
# origin/master at run time, so a PR can never change the baseline it is
# compared against, and stale branches never use an outdated baseline. The
# baseline file itself is refreshed via the reviewable PR opened by
# perfsense-baseline.yml. If origin/master has no baseline, the run is
# skipped with no comment.
#
# Integrity: the benchmark step validates that pr-results.json contains the
# expected numeric samples. An empty/failed run never posts a comparison.
#
# CLI interface (from PerfSense-AI):
#   benchmark --pages URL --runs N --metrics m1,m2 --out results.json
#   baseline save --from results.json --out baseline.json
#   report --baseline baseline.json --current results.json --config config.json --repository .
#     (outputs markdown to stdout)

on:
    pull_request:

# One run per PR; newer pushes cancel older runs.
concurrency:
    group: perfsense-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    pull-requests: write
    contents: read

jobs:
    benchmark:
        name: Performance Comparison
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout PR code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Check runtime files changed
              id: changed
              run: |
                  if git diff --exit-code --quiet \
                    "${{ github.event.pull_request.base.sha }}" \
                    "${{ github.event.pull_request.head.sha }}" \
                    -- js css dist index.html; then
                    echo "No runtime files changed; skipping PerfSense benchmark."
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Use authoritative baseline from origin/master
              if: steps.changed.outputs.changed == 'true'
              run: |
                  git fetch --quiet origin master
                  git show origin/master:baseline.json > baseline.json || true

            - name: Setup Node.js
              if: steps.changed.outputs.changed == 'true'
              uses: actions/setup-node@v5
              with:
                  node-version: "20"

            - name: Setup pnpm
              if: steps.changed.outputs.changed == 'true'
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Clone PerfSense
              if: steps.changed.outputs.changed == 'true'
              run: |
                  git clone https://github.com/ssz2605/PerfSense-AI.git /tmp/perfsense
                  git -C /tmp/perfsense checkout --quiet "$PERFSENSE_REF"
                  git -C /tmp/perfsense log -1 --format="PerfSense pinned to %H (%s)"

            - name: Build PerfSense
              if: steps.changed.outputs.changed == 'true'
              working-directory: /tmp/perfsense
              run: pnpm install --frozen-lockfile && pnpm build

            - name: Install Playwright Chromium
              if: steps.changed.outputs.changed == 'true'
              working-directory: /tmp/perfsense
              run: pnpm --filter @perfsense/driver-playwright exec playwright install chromium

            - name: Start Music Blocks server
              if: steps.changed.outputs.changed == 'true'
              run: |
                  node perfsense-server.cjs . 8787 &
                  for i in 1 2 3 4 5; do
                    curl -sf http://127.0.0.1:8787/index.html -o /dev/null && break
                    sleep 2
                  done
                  curl -sf http://127.0.0.1:8787/index.html -o /dev/null && echo "Server ready" || { echo "Server failed"; exit 1; }

            - name: Check baseline exists
              if: steps.changed.outputs.changed == 'true'
              id: baseline
              run: |
                  if [ ! -s baseline.json ]; then
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::origin/master has no baseline.json. Run the baseline workflow to capture initial data."
                  else
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run benchmark
              if: steps.changed.outputs.changed == 'true' && steps.baseline.outputs.exists == 'true'
              id: benchmark
              run: |
                  set +e
                  set -o pipefail
                  node /tmp/perfsense/packages/cli/dist/index.js benchmark \
                    --pages "http://127.0.0.1:8787/index.html?mbPerf=1" \
                    --runs 11 \
                    --metrics stageUpdateTime \
                    --out pr-results.json 2>&1 | tee benchmark.log
                  BENCH_EXIT=$?
                  echo "benchmark_exit=$BENCH_EXIT" >> "$GITHUB_ENV"

                  SAMPLE_COUNT=$(node -e "const r=require('./pr-results.json');const runs=(r[0]&&r[0].runs)||[];const n=runs.filter(x=>x.metrics&&typeof x.metrics.stageUpdateTime==='number'&&Number.isFinite(x.metrics.stageUpdateTime)).length;console.log(n)" 2>/dev/null)
                  SAMPLE_COUNT="${SAMPLE_COUNT:-0}"
                  echo "sample_count=$SAMPLE_COUNT" >> "$GITHUB_OUTPUT"

                  if [ "$BENCH_EXIT" -ne 0 ] || [ "$SAMPLE_COUNT" -lt 1 ]; then
                    echo "::error::Benchmark produced no valid stageUpdateTime samples; no comparison will be posted."
                    echo "has_results=false" >> "$GITHUB_OUTPUT"
                  else
                    if [ "$SAMPLE_COUNT" -lt 11 ]; then
                      echo "::warning::Benchmark produced only $SAMPLE_COUNT/11 valid samples"
                    fi
                    echo "has_results=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate comparison report
              if: always() && steps.changed.outputs.changed == 'true' && steps.baseline.outputs.exists == 'true' && steps.benchmark.outputs.has_results == 'true'
              id: report
              run: |
                  set +e
                  node /tmp/perfsense/packages/cli/dist/index.js report \
                    --baseline baseline.json \
                    --current pr-results.json \
                    --config perfsense.config.json \
                    --repository . > report-output.md
                  REPORT_EXIT=$?
                  echo "report_exit=$REPORT_EXIT" >> "$GITHUB_ENV"

                  if [ "$REPORT_EXIT" -ne 0 ] || [ ! -s report-output.md ]; then
                    echo "Report generation failed"
                    echo "has_report=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_report=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate PR comment
              if: always() && steps.changed.outputs.changed == 'true' && steps.baseline.outputs.exists == 'true'
              run: |
                  TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
                  HEAD_SHA=$(git rev-parse --short HEAD)

                  {
                    echo "## PerfSense Performance Report"
                    echo ""
                    echo "**PR:** #${{ github.event.pull_request.number }} · **Head:** \`$HEAD_SHA\` · **Time:** $TIMESTAMP"
                    echo "**Baseline:** \`origin/master\` · **Metric:** stageUpdateTime · **Runs:** 11"
                    echo ""

                    if [ "${{ steps.benchmark.outputs.has_results }}" != "true" ]; then
                      echo "> Warning: Benchmarks did not produce valid stageUpdateTime samples. No comparison was made. Check workflow logs."
                      echo ""
                    elif [ "${{ steps.report.outputs.has_report }}" != "true" ]; then
                      echo "> Warning: Report could not be generated. Results available but not compared."
                      echo ""
                    else
                      cat report-output.md
                      echo ""
                      if [ "${{ steps.benchmark.outputs.sample_count }}" != "11" ]; then
                        echo "> Warning: Only ${{ steps.benchmark.outputs.sample_count }}/11 benchmark samples were valid."
                        echo ""
                      fi
                    fi

                    echo "---"
                    echo "*Comment-only · non-blocking · never fails checks or blocks merges*"
                    echo "*Classification: median % delta vs thresholds (warning 10% / fail 25%). Mann-Whitney U + Cliff's delta are only computed when both samples have at least 6 valid runs (current: 11).*"
                  } > comment-body.md

            - name: Post or update PR comment
              if: always() && steps.changed.outputs.changed == 'true' && steps.baseline.outputs.exists == 'true'
              uses: thollander/actions-comment-pull-request@v3
              with:
                  file-path: comment-body.md
                  comment-tag: perfsense-report
                  mode: upsert
