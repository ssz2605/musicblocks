name: PerfSense Benchmark

# Runs on PRs that touch runtime code. Posts a single performance comparison
# comment. Comment-only — never fails checks or blocks merges.
#
# Baseline lives in baseline.json (committed on master).
# If baseline is missing or empty, the run is skipped with no comment.
# Initial baseline is captured by .github/workflows/perfsense-baseline.yml.
#
# CLI interface (from PerfSense-AI):
#   benchmark --pages URL --runs N --metrics m1,m2 --out results.json
#   baseline save --from results.json --out baseline.json
#   report --baseline baseline.json --current results.json --config config.json --repository .
#     (outputs markdown to stdout)

on:
    pull_request:
        paths:
            - "js/**"
            - "css/**"
            - "dist/**"
            - "index.html"
        paths-ignore:
            - "js/**/__tests__/**"
            - "js/**/*.test.js"
            - "locales/**"
            - "sounds/**"
            - "images/**"
            - "fonts/**"
            - "documentation/**"
            - "Docs/**"
            - "planet/**"
            - "*.md"

# One run per PR; newer pushes cancel older runs.
concurrency:
    group: perfsense-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    pull-requests: write
    contents: read

jobs:
    benchmark:
        name: Performance Comparison
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout PR code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "20"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Clone PerfSense
              run: git clone --depth 1 https://github.com/ssz2605/PerfSense-AI.git /tmp/perfsense

            - name: Build PerfSense
              working-directory: /tmp/perfsense
              run: pnpm install --frozen-lockfile && pnpm build

            - name: Install Playwright Chromium
              working-directory: /tmp/perfsense
              run: pnpm --filter @perfsense/driver-playwright exec playwright install chromium

            - name: Start Music Blocks server
              run: |
                  node perfsense-server.cjs . 8787 &
                  for i in 1 2 3 4 5; do
                    curl -sf http://127.0.0.1:8787/ -o /dev/null && break
                    sleep 2
                  done
                  curl -sf http://127.0.0.1:8787/ -o /dev/null && echo "Server ready" || { echo "Server failed"; exit 1; }

            - name: Check baseline exists
              id: baseline
              run: |
                  if [ ! -s baseline.json ]; then
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::baseline.json is empty or missing. Run the baseline workflow to capture initial data."
                  else
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Run benchmark
              if: steps.baseline.outputs.exists == 'true'
              id: benchmark
              run: |
                  set +e
                  /tmp/perfsense/packages/cli/dist/index.js benchmark \
                    --pages "http://127.0.0.1:8787/index.html?mbPerf=1" \
                    --runs 5 \
                    --metrics stageUpdateTime \
                    --out pr-results.json 2>&1 | tee benchmark.log
                  BENCH_EXIT=$?
                  echo "benchmark_exit=$BENCH_EXIT" >> "$GITHUB_ENV"

                  if [ "$BENCH_EXIT" -ne 0 ] || [ ! -s pr-results.json ]; then
                    echo "Benchmark did not produce results"
                    echo "has_results=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_results=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate comparison report
              if: always() && steps.baseline.outputs.exists == 'true' && steps.benchmark.outputs.has_results == 'true'
              id: report
              run: |
                  set +e
                  /tmp/perfsense/packages/cli/dist/index.js report \
                    --baseline baseline.json \
                    --current pr-results.json \
                    --config perfsense.config.json \
                    --repository . > report-output.md
                  REPORT_EXIT=$?
                  echo "report_exit=$REPORT_EXIT" >> "$GITHUB_ENV"

                  if [ "$REPORT_EXIT" -ne 0 ] || [ ! -s report-output.md ]; then
                    echo "Report generation failed"
                    echo "has_report=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_report=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate PR comment
              if: always() && steps.baseline.outputs.exists == 'true'
              run: |
                  TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
                  HEAD_SHA=$(git rev-parse --short HEAD)

                  {
                    echo "body<<PERFSENSE_EOF"
                    echo "## PerfSense Performance Report"
                    echo ""
                    echo "**PR:** #${{ github.event.pull_request.number }} · **Head:** \`$HEAD_SHA\` · **Time:** $TIMESTAMP"
                    echo "**Baseline:** \`master\` · **Metric:** stageUpdateTime · **Runs:** 5"
                    echo ""

                    if [ "${{ steps.benchmark.outputs.has_results }}" != "true" ]; then
                      echo "> Warning: Benchmarks did not produce results. Check workflow logs."
                      echo ""
                    elif [ "${{ steps.report.outputs.has_report }}" != "true" ]; then
                      echo "> Warning: Report could not be generated. Results available but not compared."
                      echo ""
                    else
                      cat report-output.md
                      echo ""
                    fi

                    echo "---"
                    echo "*Comment-only · non-blocking · never fails checks or blocks merges*"
                    echo "*Statistics: Mann-Whitney U (p<0.05) + Cliff's delta (>=0.147) · audio/memory metrics are warn-only*"
                    echo "PERFSENSE_EOF"
                  } > comment-body.md

            - name: Post or update PR comment
              if: always() && steps.baseline.outputs.exists == 'true'
              uses: thollander/actions-comment-pull-request@v3
              with:
                  filePath: comment-body.md
                  comment-tag: perfsense-report
                  mode: replace
