name: PerfSense Baseline Refresh

env:
    # Immutable pin. This must be the SAME revision as PERFSENSE_REF in
    # perfsense.yml, or a baseline captured by one harness is compared
    # against runs from another — two revisions can collect different metric
    # sets and time the same one differently, so the delta describes the
    # measuring code rather than the change.
    # 56618ec = baseline validity gate + harness provenance (8c57213) plus the
    #           cgroup v1 throttle fix. A baseline now records the
    #           PERFSENSE_REF that produced it, and this workflow runs
    #           `baseline validate` between saving and pushing so an
    #           untrustworthy capture never reaches the baseline branch.
    # eff3df0 = count metrics gated below their own quantization floor are
    #           exempt. Without it this workflow blocked on crabcanon
    #           maxQueueDepth, whose median 8 and p10 8 -> p90 10 is a one-unit
    #           difference that a 20% limit read as 25% of noise.
    # 88db761 = fixes the load-phase readiness rule that made RainbowConnection
    #           measure bimodal. Two captures were refused by the validity gate
    #           for it; projectLoadTime and exportMIDITime moved in opposite
    #           directions on every run, which is the signature of the harness
    #           declaring "ready" during a lull between decode stages.
    # 56d2c0f = retires maxQueueDepth from musical-tree.
    # 4102c1a = required-cell gate on save and validate; Rainbow export cells
    #           restored as warn-only; musical-tree synthsRetained demoted to a
    #           non-required exact cell; static fingerprint explanations.
    # f41ae96 = Freere synthsRetained promoted to required, which closes the
    #           #7832 gap (every one of the seven merged perf PRs now has a
    #           required cell); fingerprint loci corrected against 5bd6ae193.
    #           baseline.json currently records harness.ref 56d2c0f, so it does
    #           NOT match this pin: the next capture must be a re-capture, which
    #           is what brings cacheRebuildCount and viewportCulledBlocks in.
    PERFSENSE_REF: f41ae961a3a5590a10b04194eac9912a89f8b5bd

# Regenerates baseline.json from master on a weekly schedule.
# Opens a "chore: refresh perf baseline" PR for human review.
# Also supports manual trigger (workflow_dispatch) for initial capture.
#
# This workflow NEVER modifies master directly. It pushes to a
# dedicated branch and opens a reviewable PR.
#
# CLI interface (from PerfSense-AI):
#   benchmark --config perfsense.config.json --out results.json
#     (config drives pages, per-page scenario phases, runs, metrics, thresholds)
#   baseline save --from results.json --out baseline.json --commit <sha>
#   baseline validate --baseline baseline.json [--previous baseline.json]
#
# A capture that fails validation is not committed: the job exits non-zero
# before the push step, so a contended or bimodal run cannot become the
# reference every later PR is measured against.

on:
    schedule:
        - cron: "0 6 * * 1" # Every Monday 06:00 UTC
    workflow_dispatch:
        inputs:
            reason:
                description: "Why are you re-baselining? (shown in PR body)"
                required: false
                default: "Scheduled baseline refresh"

concurrency:
    group: perfsense-baseline
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    rebaseline:
        name: Regenerate Baseline
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout master
              uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "20"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Clone PerfSense
              run: |
                  git clone https://github.com/ssz2605/PerfSense-AI.git /tmp/perfsense
                  git -C /tmp/perfsense checkout --quiet "$PERFSENSE_REF"
                  git -C /tmp/perfsense log -1 --format="PerfSense pinned to %H (%s)"

            - name: Build PerfSense
              working-directory: /tmp/perfsense
              run: pnpm install --frozen-lockfile && pnpm build

            - name: Install Playwright Chromium
              working-directory: /tmp/perfsense
              run: pnpm --filter @perfsense/driver-playwright exec playwright install chromium

            - name: Start Music Blocks server
              run: |
                  node perfsense-server.cjs . 8787 &
                  for i in 1 2 3 4 5; do
                    curl -sf http://127.0.0.1:8787/index.html -o /dev/null && break
                    sleep 2
                  done
                  curl -sf http://127.0.0.1:8787/index.html -o /dev/null && echo "Server ready" || { echo "Server failed"; exit 1; }

            - name: Run benchmark suite
              run: |
                  # Redirect rather than pipe through tee, and carry the exit
                  # code by hand. Two reasons, both load-bearing:
                  #   - the cli calls process.exit(), and Node writes to a pipe
                  #     asynchronously but to a file synchronously, so a pipe
                  #     could truncate the tail of the log;
                  #   - with a bare `| tee` the pipeline status is tee's, which
                  #     would let this job save a baseline from a failed capture.
                  set +e
                  node /tmp/perfsense/packages/cli/dist/index.js benchmark \
                    --config perfsense.config.json \
                    --out benchmark-results.json > benchmark.log 2>&1
                  BENCH_EXIT=$?
                  cat benchmark.log
                  exit $BENCH_EXIT

            - name: Save baseline
              run: |
                  node /tmp/perfsense/packages/cli/dist/index.js baseline save \
                    --from benchmark-results.json \
                    --out baseline-new.json \
                    --commit "$(git rev-parse HEAD)"

            - name: Stamp runner metadata into baseline
              run: |
                  COMMIT_SHA=$(git rev-parse HEAD)
                  CHROME_VERSION=$(google-chrome --version 2>/dev/null || echo "unknown")

                  RAINBOW_HASH=$(sha256sum examples/RainbowConnection.html | cut -c1-16)
                  FRERE_HASH=$(sha256sum examples/Frere-Jacques.html | cut -c1-16)
                  TREE_HASH=$(sha256sum examples/musical-tree.html | cut -c1-16)
                  SPIRAL_HASH=$(sha256sum examples/ascending-notes-color-spiral.html | cut -c1-16)
                  CRAB_HASH=$(sha256sum examples/crabcanon-plot.html | cut -c1-16)

                  node -e "
                    const fs = require('fs');
                    const bl = JSON.parse(fs.readFileSync('baseline-new.json','utf8'));
                    bl.commitSha = '$COMMIT_SHA';
                    bl.runner = bl.runner || {};
                    bl.runner.os = 'ubuntu-latest';
                    bl.runner.chromeVersion = '$CHROME_VERSION';
                    bl.runner.nodeVersion = process.version.replace(/^v/, '');
                    bl.statistics = {
                      flagRule: 'MannWhitneyU p<0.05 AND medianDelta>=threshold AND cliffsDelta>=0.147',
                      minRuns: 5
                    };
                    bl.fixtureHashes = {
                      'RainbowConnection.html': '$RAINBOW_HASH',
                      'Frere-Jacques.html': '$FRERE_HASH',
                      'musical-tree.html': '$TREE_HASH',
                      'ascending-notes-color-spiral.html': '$SPIRAL_HASH',
                      'crabcanon-plot.html': '$CRAB_HASH'
                    };
                    fs.writeFileSync('baseline-new.json', JSON.stringify(bl, null, 2) + '\\n');
                  "

            - name: Validate baseline before committing
              run: |
                  # baseline.json in the working tree is master's current
                  # baseline (this job checked out master), which is what the
                  # divergence check needs. A new commit legitimately moves
                  # every median, so the check only reports a verdict when the
                  # commit and the runner both match.
                  #
                  # set +e plus an explicit exit is what keeps this gate honest
                  # while still writing validate.log: under the default bash -e
                  # the node line would abort the script before the exit code
                  # was captured or the log echoed, and a bare `| tee` would
                  # report tee's status instead of validate's. Redirecting to a
                  # file (synchronous in Node, unlike a pipe) also guarantees
                  # the defect table - which validate writes to stderr - is
                  # complete in the file the upload step collects.
                  set +e
                  node /tmp/perfsense/packages/cli/dist/index.js baseline validate \
                    --baseline baseline-new.json \
                    --previous baseline.json \
                    --config perfsense.config.json > validate.log 2>&1
                  VALIDATE_EXIT=$?
                  cat validate.log
                  exit $VALIDATE_EXIT

            # Deliberately not gated on the previous step's outcome: when
            # validate fails, the commit step never runs and this job's only
            # surviving output is the runner log. Always() is what keeps the
            # capture and the defect table retrievable on exactly the runs
            # worth diagnosing. Caveat: always() does not fire if the job hit
            # timeout-minutes and was cancelled.
            - name: Upload capture and validate output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: perfsense-capture
                  path: |
                      benchmark-results.json
                      baseline-new.json
                      benchmark.log
                      validate.log
                  if-no-files-found: warn
                  retention-days: 30

            - name: Push to refresh branch
              run: |
                  BRANCH="perf-baseline-refresh"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Delete remote branch if it exists (idempotent re-run)
                  git push origin --delete "$BRANCH" 2>/dev/null || true

                  git checkout -b "$BRANCH"
                  cp baseline-new.json baseline.json
                  git add baseline.json
                  git commit -m "chore(perf): refresh PerfSense baseline" \
                    -m "Captured from master@$(git rev-parse --short HEAD)" \
                    -m "Reason: ${{ github.event.inputs.reason || 'Weekly scheduled refresh' }}"

                  git push origin "$BRANCH"

            - name: Open or update baseline PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const branch = 'perf-baseline-refresh';
                      const title = 'chore: refresh perf baseline';
                      const headSha = '${{ github.sha }}'.substring(0, 7);
                      const reason = `${{ github.event.inputs.reason || 'Weekly scheduled refresh' }}`;

                      // Check for existing open PR from this branch
                      const { data: existing } = await github.rest.pulls.list({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        head: `${context.repo.owner}:${branch}`,
                      });

                      const body = [
                        '## PerfSense Baseline Refresh',
                        '',
                        `**Source:** \`master@${headSha}\``,
                        `**Reason:** ${reason}`,
                        `**Triggered by:** ${{ github.event_name }}`,
                        '',
                        'This PR updates `baseline.json` with fresh performance data from master.',
                        'Review the diff to verify metric changes match recently merged work.',
                        '',
                        'Once merged, all subsequent PR comparisons will use this baseline.',
                        '',
                        '---',
                        '*Auto-generated by PerfSense baseline workflow. Safe to merge after review.*',
                      ].join('\n');

                      if (existing.length > 0) {
                        // Update existing PR
                        await github.rest.pulls.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: existing[0].number,
                          body,
                        });
                        core.info(`Updated existing PR #${existing[0].number}`);
                      } else {
                        // Create new PR
                        const { data: pr } = await github.rest.pulls.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title,
                          head: branch,
                          base: 'master',
                          body,
                        });
                        core.info(`Created PR #${pr.number}`);
                      }
